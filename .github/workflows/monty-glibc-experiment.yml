name: Monty 1037 glibc experiment

on:
  push:
    branches:
      - experiment/monty-1037-glibc

permissions:
  contents: read

jobs:
  compare:
    if: github.repository == 'RanaPriyansh/monty'
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      CARGO_BUILD_JOBS: '2'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@e2a55d2ffb04f378e9626c28d38b36d230d1e12f
        with:
          toolchain: stable
          targets: x86_64-unknown-linux-gnu
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 24
          package-manager-cache: false
      - name: Compare fresh addons and packed Node packages
        run: python3 .github/scripts/monty-glibc-experiment.py
      - name: Preserve experiment evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: monty-1037-glibc-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            glibc-experiment/evidence/**/*.log
            glibc-experiment/evidence/**/*.json
            glibc-experiment/evidence/**/*.jsonl
            glibc-experiment/evidence/**/*.txt
            glibc-experiment/evidence/**/*.sh
            glibc-experiment/evidence/**/*.tgz
            !glibc-experiment/evidence/*/smoke/**
          if-no-files-found: error
          retention-days: 7
